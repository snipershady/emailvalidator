name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Privilegi minimi per il GITHUB_TOKEN. Le action di terze parti sono pinnate
# a SHA di commit (il commento indica la versione) e aggiornate da Dependabot.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Le versioni dei tool di analisi statica sono validate una sola volta,
  # sulla versione minima supportata dalla libreria (vedi composer.json).
  LINT_PHP_VERSION: '8.3'

jobs:
  lint:
    # Il campo "name" del job non supporta il contesto env (solo github,
    # matrix, strategy, needs, vars, inputs): la versione PHP resta hardcoded
    # qui, ma è pilotata da env.LINT_PHP_VERSION negli step sottostanti.
    name: Static analysis (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.LINT_PHP_VERSION }}
          extensions: intl, mbstring, filter, dom, json, libxml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ env.LINT_PHP_VERSION }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ env.LINT_PHP_VERSION }}-

      # Nessun composer.lock è versionato (scelta deliberata per una libreria):
      # si risolve sempre contro i vincoli correnti di composer.json.
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: PHPStan (livello max)
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP-CS-Fixer (regole @Symfony, dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: Rector (dry-run)
        run: vendor/bin/rector process --dry-run

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, filter, dom, json, libxml, xmlwriter
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # I test nel gruppo "network" (tests/Integration/) sono esclusi di
      # default da phpunit.xml.dist: qui restano gli unit test puri, che non
      # toccano la rete e non dipendono dallo stato DNS di domini terzi.
      - name: PHPUnit con coverage
        run: vendor/bin/phpunit --coverage-text --colors=never

  network-tests:
    name: Integration tests (real DNS, non bloccante)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.LINT_PHP_VERSION }}
          extensions: intl, mbstring, filter, dom, json, libxml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # Dipendono da DNS reale e dallo stato di domini di terze parti
      # (example.com, gmail.com, ...): informativi, non devono far fallire la CI.
      - name: PHPUnit --group network
        run: vendor/bin/phpunit --group network --colors=never
